name: CI

on:
  push:
  pull_request:

jobs:
  cpu-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install CPU test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Compile Python sources
        run: python -m compileall -q runtime bootstrap tests scripts
      - name: Run CPU regression tests
        env:
          KERAS_BACKEND: jax
          USE_TORCH_XLA: "0"
        run: pytest -q tests
      - name: Validate repository health
        run: python scripts/check_repo_health.py
      - name: Check whitespace
        run: git diff --check
